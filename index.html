<div class="modal-overlay hidden" id="help-modal">
    <div class="modal modal-small">
        <div class="modal-header modal-header-info">
            <h3><svg class="si"><use href="#i-info"/></svg> Ajuda · Acesso por Telefone</h3>
            <button class="modal-close" onclick="closeHelpModal()">×</button>
        </div>
        <div class="modal-body">
            <div id="help-error" class="alert alert-danger hidden"></div>

            <div id="help-step-phone">
                <p class="modal-text-muted" style="margin-bottom:14px;">
                    Informe seu número de celular. Enviaremos um código por SMS para verificar sua identidade.
                </p>
                <div class="form-group">
                    <label for="help-phone-input">Número de celular (formato internacional)</label>
                    <input type="tel" id="help-phone-input" class="form-control" placeholder="+5511999999999">
                    <span class="form-hint">Ex.: +5511999999999 (DDI + DDD + número)</span>
                </div>
                <div id="help-recaptcha"></div>
                <button class="btn btn-primary btn-block" id="help-send-btn" onclick="sendHelpCode()">
                    <svg class="si"><use href="#i-sign-in"/></svg> Enviar Código
                </button>
            </div>

            <div id="help-step-code" class="hidden">
                <p class="modal-text-muted" style="margin-bottom:14px;">
                    Digite o código de 6 dígitos que enviamos por SMS.
                </p>
                <div class="form-group">
                    <label for="help-code-input">Código SMS</label>
                    <input type="text" id="help-code-input" class="form-control"
                           placeholder="000000" maxlength="6" inputmode="numeric" autocomplete="one-time-code">
                </div>
                <button class="btn btn-success btn-block" id="help-verify-btn" onclick="verifyHelpCode()">
                    <svg class="si"><use href="#i-check"/></svg> Verificar
                </button>
                <button class="btn btn-secondary btn-block" style="margin-top:8px;"
                        onclick="document.getElementById('help-step-code').classList.add('hidden');document.getElementById('help-step-phone').classList.remove('hidden');">
                    ← Voltar
                </button>
            </div>

            <div id="help-step-result" class="hidden"></div>
        </div>
    </div>
</div>
